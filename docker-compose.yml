# =====================================================================
# proyectorestaurante — Orquestación de servicios
# Uso:   cp .env.example .env   (editar contraseñas)
#        docker compose up -d --build
# Ruta:  proyectorestaurante/docker-compose.yml
# =====================================================================
name: proyectorestaurante

services:
  # -------------------------------------------------------------------
  # Base de datos MariaDB
  # -------------------------------------------------------------------
  db:
    image: mariadb:11.4                # LTS; fija la versión menor para builds reproducibles
    container_name: restaurante_db
    restart: unless-stopped
    command:
      # Fuerza utf8mb4 a nivel servidor (acentos, ñ, emojis) igual que schema.sql
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # ${VAR:?msg} hace que `docker compose up` falle con un mensaje claro
      # si la variable no existe en .env, en vez de arrancar sin contraseña.
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MARIADB_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      # Solo escucha en localhost del HOST (DBeaver/Workbench locales).
      # Entre contenedores la app SIEMPRE usa db:3306 por la red interna.
      - "127.0.0.1:${MYSQL_EXPOSED_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Scripts de inicialización: se ejecutan en orden alfabético SOLO
      # cuando el volumen mariadb_data está vacío (primer arranque).
      # Para re-ejecutarlos: docker compose down -v && docker compose up -d
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
    healthcheck:
      # Script incluido en la imagen oficial de MariaDB
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - restaurante_net

  # -------------------------------------------------------------------
  # Aplicación Streamlit (punto de venta + módulos)
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy    # no arranca hasta que MariaDB acepte conexiones
    environment:
      # Host = nombre del servicio en la red de Docker, NUNCA "localhost"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      RESTAURANTE_NOMBRE: ${RESTAURANTE_NOMBRE:-Los Bro's Restaurant}
      TZ: ${TZ:-America/Mexico_City}
      # Ajustes de Streamlit para contenedor
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      # Monta el código para editar sin reconstruir la imagen
      # (Streamlit recarga al detectar cambios en los .py).
      - ./app:/app
    healthcheck:
      # Usa Python (siempre presente en la imagen) en lugar de curl,
      # que NO viene instalado en python:3.11-slim.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - restaurante_net

networks:
  restaurante_net:
    driver: bridge

volumes:
  mariadb_data:
